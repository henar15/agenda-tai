<!DOCTYPE html>
<html lang="es" data-v="15">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6d28d9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Mi agenda TAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
/* VOICE: cercana y ordenada, como una agenda personal de estudio que da ánimo sin infantilizar.
   IDEA: una agenda de opositora con pestañas de colores, una por bloque del temario.
   PICTURE: el anillo de progreso del temario y las 4 barras de bloque; en tarjetas, la tarjeta grande que se gira.
   COLOUR and TYPE: blanco papel, tinta casi negra, violeta como color principal; bloques I violeta, II verde azulado, III azul, IV naranja. Nunito redondeada.
   LAYOUT: barra de pestañas arriba, cada vista ocupa la página; móvil en una columna. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#15131c);--panel:light-dark(#f6f4fb,#201d2a);--line:light-dark(#e6e2f0,#332f40);
--ink:light-dark(#1d1a26,#f1eef8);--muted:light-dark(#625c72,#aaa3bd);
--acc:light-dark(#6d28d9,#b69cff);--accbg:light-dark(#ede7fb,#2c2440);
--b1:#7c3aed;--b2:#0d9488;--b3:#2563eb;--b4:#ea580c;
--ok:light-dark(#15803d,#4ade80);--mid:light-dark(#b45309,#fbbf24);--bad:light-dark(#b91c1c,#f87171)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:12px max(4vw,16px) 0;flex-wrap:wrap}
.top h1{font-size:20px;font-weight:900;margin:0;letter-spacing:-.01em}
.top .sync{margin-left:auto;font-size:13px;color:var(--muted)}
nav{display:flex;gap:4px;padding:8px max(4vw,16px) 0;overflow-x:auto}
nav a{flex:none;text-decoration:none;color:var(--muted);font-weight:800;padding:10px 16px;border-radius:12px 12px 0 0;min-height:44px;display:flex;align-items:center}
nav a.on{color:var(--ink);background:var(--panel);box-shadow:inset 0 3px 0 var(--acc)}
main{padding:clamp(20px,3vw,40px) max(4vw,16px);max-width:1240px;margin:0 auto}
h2{font-size:clamp(26px,4vw,36px);line-height:1.08;margin:0 0 6px;font-weight:900;text-wrap:balance}
h3{font-size:19px;margin:0 0 10px;font-weight:900}
.sub{color:var(--muted);margin:0 0 22px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.card{background:var(--panel);border-radius:18px;padding:20px}
.hero{display:grid;gap:24px;grid-template-columns:minmax(0,300px) minmax(0,1fr);align-items:center;margin-bottom:24px}
@media(max-width:700px){.hero{grid-template-columns:minmax(0,1fr)}}
.ring{position:relative;width:min(100%,280px);aspect-ratio:1;margin:auto}
.ring svg{width:100%;height:100%}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-size:clamp(44px,8vw,60px);line-height:1;font-weight:900}
.ring .c span{color:var(--muted);font-weight:700}
.bars{display:grid;gap:14px}
.bar .lab{display:flex;justify-content:space-between;font-weight:800;font-size:15px}
.bar .tr{height:14px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:5px}
.bar .tr i{display:block;height:100%;border-radius:9px;transition:width .5s}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--panel);border-radius:16px;padding:16px}
.kpi b{display:block;font-size:30px;font-weight:900;line-height:1.1}
.kpi span{font-size:14px;color:var(--muted);font-weight:700}
.list{display:grid;gap:8px}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:14px}
.row .t{flex:1}
.row small{color:var(--muted);display:block}
.tag{flex:none;font-size:13px;font-weight:900;color:#fff;border-radius:8px;padding:2px 8px;white-space:nowrap}
.pill{flex:none;border:0;border-radius:99px;padding:8px 14px;font-weight:800;font-size:14px;min-height:40px;white-space:nowrap}
.p-pendiente{background:var(--line);color:var(--muted)}.p-en-curso{background:#fef3c7;color:#92400e}.p-estudiado{background:#dcfce7;color:#166534}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:900;min-height:44px;background:var(--acc);color:#fff}
.btn.ghost{background:var(--panel);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.blk{margin-bottom:28px}
.blk>h3{display:flex;gap:10px;align-items:center}
.warn{background:#fff7ed;color:#7c2d12;border-radius:14px;padding:14px 16px;font-weight:700;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
:root[data-theme=dark] .warn{background:#3a2412;color:#fed7aa}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .warn{background:#3a2412;color:#fed7aa}}
.empty{color:var(--muted);padding:24px;text-align:center;border:2px dashed var(--line);border-radius:16px}
/* tarjetas */
.study{display:grid;gap:18px;max-width:720px;margin:0 auto}
.picker{display:flex;gap:10px;flex-wrap:wrap}
select{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:8px 12px;font-size:16px}
.flip{perspective:1400px;cursor:pointer}
.fc{position:relative;height:clamp(300px,52vw,380px);transition:transform .55s;transform-style:preserve-3d}
.flip.on .fc{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:26px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;box-shadow:0 10px 30px -12px rgba(30,20,60,.35)}
.face.f{background:var(--cl);border-left:12px solid var(--cc)}
.face.b{background:var(--bg);border:2px solid var(--line);border-top:12px solid var(--cc);transform:rotateY(180deg)}
.face .em{font-family:'Noto Color Emoji';font-size:64px;line-height:1}
.face .q{font-size:clamp(20px,3.4vw,27px);font-weight:900;line-height:1.25;color:#1d1a26}
.face .a{font-size:clamp(19px,3vw,25px);font-weight:600;line-height:1.35;white-space:pre-line}
.face .a b{color:var(--cc);font-weight:900}
.face .h{font-size:15px;background:var(--cl);color:#1d1a26;border-radius:12px;padding:8px 14px}
.face .tp{position:absolute;top:12px;left:20px;font-size:12px;font-weight:900;background:#fde68a;color:#78350f;border-radius:6px;padding:2px 8px}
.face .n{position:absolute;top:14px;right:20px;font-weight:900;font-size:13px;color:var(--cc)}
.face .hint{position:absolute;bottom:14px;font-size:13px;color:#625c72;font-weight:700}
.piles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.piles button{border:0;border-radius:16px;padding:14px 8px;font-weight:900;min-height:64px;font-size:16px}
.pl1{background:#fee2e2;color:#991b1b}.pl2{background:#fef3c7;color:#92400e}.pl3{background:#dcfce7;color:#166534}
.stack3{display:flex;height:12px;border-radius:8px;overflow:hidden;background:var(--line)}
.stack3 i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);font-weight:700;margin-top:6px}
/* tests */
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 16px;margin-bottom:8px;font-weight:700;min-height:48px}
.opt.sel{border-color:var(--acc);background:var(--accbg)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--bg))}
.opt.ko{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;font-size:14px;margin-bottom:8px}
.qtext{font-size:20px;font-weight:800;line-height:1.35;margin:0 0 16px}
.exp{background:var(--panel);border-radius:12px;padding:12px 14px;margin:6px 0 16px;font-size:15px}
.big{font-size:clamp(48px,9vw,72px);font-weight:900;line-height:1}
.fig{position:relative;min-height:300px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.modes{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));margin-bottom:28px}
.mode{border:0;text-align:left;border-radius:18px;padding:18px;min-height:120px;display:flex;flex-direction:column;gap:6px;background:var(--panel);color:var(--ink)}
.mode b{font-size:18px;font-weight:900}.mode span{font-size:14px;color:var(--muted);font-weight:700}
.mode .cnt{margin-top:auto;font-size:28px;font-weight:900;color:var(--acc)}
.mode.red .cnt{color:var(--bad)}
.mode:disabled{opacity:.5}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf button{border:0;border-radius:18px;min-height:72px;font-size:20px;font-weight:900}
.vf .v{background:#dcfce7;color:#166534}.vf .f{background:#fee2e2;color:#991b1b}
.stmt{background:var(--panel);border-radius:22px;padding:24px;font-size:19px;line-height:1.4}
.stmt .o{display:block;margin-top:12px;font-size:21px;font-weight:900;color:var(--acc)}
.timer{display:flex;justify-content:space-between;font-weight:900;font-size:18px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match button{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:12px;text-align:left;font-weight:700;min-height:64px;font-size:15px;line-height:1.3}
.match button.sel{border-color:var(--acc);background:var(--accbg)}
.match button.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--bg));opacity:.6}
.match button.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.tip{display:inline-block;font-size:12px;font-weight:900;background:#fde68a;color:#78350f;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:6px;margin:8px 0 24px}
.phases div{border-radius:12px;padding:10px 12px;color:#fff;font-weight:800;font-size:13px;line-height:1.25;min-width:0}
.phases div small{display:block;font-weight:600;opacity:.9}
.week{display:grid;grid-template-columns:86px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.week .d{font-weight:900;font-size:15px;line-height:1.2}.week .d small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.week.now{background:var(--accbg);border-radius:14px;padding:14px;border:0;margin:6px 0}
.week.past{opacity:.55}
.week h4{margin:0 0 6px;font-size:16px;font-weight:900;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ph{font-size:12px;font-weight:900;color:#fff;border-radius:6px;padding:1px 8px}
.tasks{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.tasks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15px}
.tasks input{width:20px;height:20px;margin-top:2px;accent-color:var(--acc);flex:none}
.tasks .ok{text-decoration:line-through;color:var(--muted)}
.month{font-size:22px;font-weight:900;margin:28px 0 4px}.month::first-letter{text-transform:uppercase}
.routine{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.routine div{background:var(--panel);border-radius:14px;padding:14px;font-size:14px}.routine b{display:block;font-size:16px}
@media(max-width:600px){.week{grid-template-columns:1fr;gap:6px}}
.dtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.dtabs button{border:0;border-radius:10px;padding:8px 12px;min-height:40px;font-weight:800;background:var(--bg);color:var(--muted)}.dtabs button.on{background:var(--acc);color:#fff}
.tline{display:grid;gap:6px}.blk-h{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--bg);border-left:5px solid var(--bc)}
.blk-h .hh{font-weight:900;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}.blk-h small{display:block;color:var(--muted);font-size:13px}.blk-h.cur{background:color-mix(in srgb,var(--bc) 16%,var(--bg));box-shadow:0 0 0 2px var(--bc)}
.ahora{font-size:12px;font-weight:900;color:#fff;background:var(--bc);border-radius:6px;padding:2px 8px}
.streak{display:flex;gap:14px;align-items:center;margin-bottom:12px}.streak .fire{font-size:42px;font-weight:900;line-height:1;color:#ea580c;min-width:56px;text-align:center}.streak small{display:block;color:var(--muted);font-weight:700}
.heat{display:flex;gap:3px}.heat div{display:grid;gap:3px}.heat i{display:block;width:12px;height:12px;border-radius:3px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.badges span{border-radius:12px;padding:8px 10px;background:var(--bg);border:2px dashed var(--line);opacity:.55}.badges span.on{opacity:1;border:2px solid #f59e0b;background:color-mix(in srgb,#f59e0b 14%,var(--bg))}.badges b{display:block;font-size:14px}.badges small{font-size:12px;color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.mini{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:6px 10px;font-weight:800;font-size:13px;min-height:34px;text-decoration:none;display:inline-flex;align-items:center}.mini.hi{background:var(--acc);border-color:var(--acc);color:#fff}.mini.ghost{color:var(--muted)}.mini.done{color:var(--ok);border-color:var(--ok)}
.pdff{display:flex;gap:6px;margin-top:8px}.pdff input{flex:1;min-height:38px;border-radius:9px;border:1px solid var(--line);background:var(--bg);padding:6px 10px;font-size:16px}
.trow{align-items:flex-start}
@media(max-width:600px){.blk-h{grid-template-columns:86px 1fr;gap:8px}.blk-h .hh{font-size:12.5px}.blk-h .ahora{grid-column:2}.heat i{width:9px;height:9px}}
.note{font-size:13px;color:var(--muted);margin-top:28px}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--muted)}.stack td:empty{display:none}}
@media(prefers-reduced-motion:reduce){.fc,.bar .tr i{transition:none}}

nav a i{font-style:normal;margin-right:6px}
body.out nav,body.out #sync{display:none}
.login{max-width:440px;margin:8vh auto 0;text-align:center;padding:0 8px}.login .lg-ico{font-size:56px}.login h2{font-size:28px;margin:8px 0}.login .sub{font-size:17px}
.btn.big{min-height:56px;padding:12px 26px;font-size:18px;display:inline-flex;gap:12px;align-items:center;margin:18px 0 10px;background:#fff;color:#1f1f1f;border:1px solid var(--line);box-shadow:0 2px 10px rgb(0 0 0 / .12)}
.fine{font-size:14px;color:var(--muted)}
.av{width:32px;height:32px;border-radius:50%;vertical-align:middle;margin-right:8px}
.hola{font-size:26px;margin:4px 0 14px}
.go{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.gob{display:flex;align-items:center;gap:12px;padding:16px;border-radius:16px;background:var(--acc);color:#fff;text-decoration:none;min-height:64px;font-size:17px}.gob span{font-size:26px}.gob:nth-child(2){background:#0d9488}.gob:nth-child(3){background:#ea580c}
.more{display:inline-block;margin-top:10px;color:var(--acc);font-weight:800;text-decoration:none;padding:6px 0}
.hcard{margin-bottom:24px}.hcard h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.blk-h .x{border:0;background:transparent;color:var(--muted);font-size:18px;min-width:40px;min-height:40px;border-radius:10px;cursor:pointer}.blk-h .x:hover{background:var(--line)}
.hform{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0;align-items:end}.hform label{display:grid;gap:4px;font-size:13px;font-weight:800;color:var(--muted)}.hform .w{grid-column:1/-1}
.hform input,.hform select{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 10px;font:inherit;font-size:16px}
details.mes{border:1px solid var(--line);border-radius:14px;margin:10px 0;background:var(--panel)}details.mes>summary{cursor:pointer;padding:14px 16px;font-weight:900;font-size:17px;text-transform:capitalize;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:52px}details.mes>summary::after{content:'▾';color:var(--muted)}details.mes[open]>summary::after{content:'▴'}details.mes>summary small{margin-left:auto;margin-right:10px;color:var(--muted);font-weight:700;text-transform:none}details.mes .week{margin:0 10px 10px}
.blk-h .x{grid-column:3;grid-row:1}
@media(max-width:700px){
  .dtabs{flex-wrap:nowrap;gap:4px}.dtabs button{flex:1;padding:8px 0;font-size:14px}
  .phases{display:none}
  .row{flex-wrap:wrap}.row .t{min-width:0;flex:1 1 60%}.row .pill{order:3;margin-left:auto}
  body{font-size:17px;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  .top{padding:10px 16px}.top h1{font-size:18px}.top .sync{display:none}#acct{margin-left:auto}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom));gap:0;justify-content:space-around;overflow:visible;box-shadow:0 -4px 16px rgb(0 0 0 / .06)}
  nav a{flex:1;flex-direction:column;gap:2px;padding:6px 0;border-radius:10px;min-height:56px;justify-content:center;font-size:11px;font-weight:800}
  nav a i{margin:0;font-size:21px;line-height:1}
  nav a.on{box-shadow:none;background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc)}
  main{padding-top:12px!important}
  .card{padding:16px!important;border-radius:16px}
  .kpis{grid-template-columns:repeat(3,1fr)!important;gap:8px!important}.kpi{padding:12px 8px!important;text-align:center}.kpi b{font-size:22px!important}.kpi span{font-size:13px!important}
  .go{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr!important;justify-items:center}.ring{width:180px!important;height:180px!important}
  h2{font-size:24px}
  .row{padding:14px!important}.acts .mini{min-height:42px;padding:8px 14px;font-size:14px}
}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));z-index:50;display:flex;gap:12px;align-items:center;background:#1f1147;color:#fff;padding:12px 20px;border-radius:16px;box-shadow:0 10px 30px rgb(0 0 0 / .3);animation:tin .4s ease}.toast span{font-size:30px}.toast small{display:block;opacity:.8;font-size:12px}.toast b{font-size:17px}
@keyframes tin{from{opacity:0;transform:translate(-50%,20px)}}
.badges em{font-style:normal;font-size:22px;display:block}.lgg{margin:16px 0 8px;font-size:15px;color:var(--muted)}.lgbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.lgbar i{display:block;height:100%;background:#f59e0b}
.pt-hero{text-align:center;max-width:760px;margin:4vh auto 8px}.pt-hero .kick{display:inline-block;font-weight:800;font-size:13px;color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);padding:6px 12px;border-radius:99px}
